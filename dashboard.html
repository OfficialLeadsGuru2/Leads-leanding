```html<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Watch Time Dashboard</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background-color: #000000;
color: #ff9900;
}
​h2 {
color: #ff9900;
text-align: center;
}
​.summary-box {
background-color: #1a1a1a;
padding: 15px;
border-radius: 5px;
margin-bottom: 20px;
font-weight: bold;
border: 1px solid #333;
}
​table {
width: 100%;
border-collapse: collapse;
background-color: #1a1a1a;
border: 1px solid #333;
}
​th, td {
padding: 12px;
border: 1px solid #333;
text-align: left;

}
​th {

</head>
<body>
​<h2>User Watch Time Dashboard</h2>
​<div class="summary-box">
Total Video Completions: <span id="total-completions">0</span>
</div>
​<table>
<thead>
<tr>
<th>User Name</th>
<th>Furthest Watched Point (s)</th>
<th>Last Updated</th>
</tr>
</thead>
<tbody id="user-table-body">

</tbody>
</table>
​<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-database.js";
​const firebaseConfig = {
apiKey: "AIzaSyDQ5_Dm4QL5L1neubND79i7w9eZ-yG1o",
authDomain: "leadsguru-942de.firebaseapp.com",
databaseURL: "https://leadsguru-942de-default-rtdb.firebaseio.com",
projectId: "leadsguru-942de",
storageBucket: "leadsguru-942de.appspot.com",
messagingSenderId: "712411117397",
appId: "1:712411117397:web:000ae6fd55e7dd4d7e1dc",
measurementId: "G-V244ZMV4G7"
};
​const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const usersRef = ref(db, 'users');
​onValue(usersRef, (snapshot) => {
const data = snapshot.val();
const tableBody = document.getElementById('user-table-body');
const totalCompletionsEl = document.getElementById('total-completions');
​tableBody.innerHTML = '';
let completedCount = 0;
​for (const userId in data) {

​const furthestWatched = user.watchData ? user.watchData.furthestWatchedPoint : 'N/A';
const lastUpdated = user.watchData ? new Date(user.watchData.lastTimestamp).toLocaleString() : 'N/A';
​if (user.watchData && user.watchData.furthestWatchedPoint >= 679) {
completedCount++;
}
​row.innerHTML = <td>${userId}</td> <td>${furthestWatched}</td> <td>${lastUpdated}</td>;
tableBody.appendChild(row);
}
totalCompletionsEl.textContent = completedCount;
});
</script>
</body>
