<!DOCTYPE html>
<html lang="hi">
<head>

 <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-image: url('ebef427a893f6cfea45b736b76175e26'); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; text-align: center; }
    .container { background: rgba(0, 0, 0, 0.7); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); max-width: 600px; width: 90%; }

 </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    const video = document.getElementById('promoVideo');
    let maxTime = 0;

    video.addEventListener('timeupdate', () => {
      if (video.currentTime > maxTime) {
        maxTime = video.currentTime;
      }
    });

    video.addEventListener('seeking', () => {
      if (video.currentTime > maxTime) {
        video.currentTime = maxTime;
      }
    });
  });
 </script>

    <video id="promoVideo" controls controlsList="nodownload">

</body>
