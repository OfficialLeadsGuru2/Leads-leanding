<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: rainbow 15s ease infinite;
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            text-align: center;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 80%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- वीडियो का लिंक यहाँ डालें -->
        <video id="myVideo" controls controlsList="nodownload">
            <source src="YOUR_VIDEO_URL_HERE.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <h1>Leeds Guru</h1>
        <p>Let's start your high paying skills</p>
        <p>Let's start work with us</p>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        let lastPlayedTime = 0;

        video.addEventListener('timeupdate', () => {
            if (!video.seeking) {
                lastPlayedTime = video.currentTime;
            }
        });

        video.addEventListener('seeking', () => {
            if (video.currentTime > lastPlayedTime) {
                video.currentTime = lastPlayedTime;
            }
        });
    </script>

</body>
</html>
