<!DOCTYPE html>
<html>
<head>
<title>Protected Video Player</title>
</head>
<body>

<video id="myVideo" width="640" height="390" controls>
  <source src="https://archive.org/download/without-bronze-unlock-your-earning-potential-with-digital-skills-leads-guru-2026-1080-p-hd/Without%20Bronze%20__%20Unlock%20Your%20Earning%20Potential%20with%20Digital%20Skills%20__%20LeadsGuru%202026%281080P_HD%29.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

<script>
var video = document.getElementById('myVideo');
var maxTime = 0;

video.addEventListener('timeupdate', function() {
  if (video.currentTime > maxTime + 1) {
    video.currentTime = maxTime;
  } else if (video.currentTime > maxTime) {
    maxTime = video.currentTime;
  }
});
</script>

</body>
</html>
