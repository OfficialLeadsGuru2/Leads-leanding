    width: 100%;

<body>
  <div class="frame">
    <video id="promoVideo" controls playsinline preload="metadata" controlsList="nodownload noplaybackrate" disablePictureInPicture>
      <source src="https://archive.org/download/without-bronze-unlock-your-earning-potential-with-digital-skills-leads-guru-2026-1080-p-hd/Without%20Bronze%20__%20Unlock%20Your%20Earning%20Potential%20with%20Digital%20Skills%20__%20LeadsGuru%202026%281080P_HD%29.ia.mp4" type="video/mp4">
      आपका ब्राउज़र वीडियो टैग का समर्थन नहीं करता है।
    </video>
  </div>

<script>
  const video = document.getElementById('promoVideo');
  let maxTime = 0;   // अब तक देखा गया सबसे आगे का समय
  let lastTime = 0;  // पिछली बार का प्ले समय

  // सामान्य प्ले के दौरान ही maxTime बढ़ाएँ
  video.addEventListener('timeupdate', () => {
    if (video.seeking) return;
    if (video.currentTime - lastTime < 2.5) {
      maxTime = Math.max(maxTime, video.currentTime);
    }
    lastTime = video.currentTime;
  });

  // देखे हुए हिस्से से आगे स्किप करने पर वापस वहीं भेज दें
  video.addEventListener('seeking', () => {
    if (video.currentTime > maxTime + 0.5) {
      video.currentTime = maxTime;
    }
  });

  video.addEventListener('seeked', () => {
    lastTime = video.currentTime;
  });

  // 2x से तेज़ स्पीड करके आगे भागने से रोकें
  video.addEventListener('ratechange', () => {
    if (video.playbackRate > 2) video.playbackRate = 1;
  });
</script>
