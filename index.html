<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadsGuru Earning Potential</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body {
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: url('https://raw.githubusercontent.com/OfficialLeadsGuru2/Leads-leanding/refs/heads/main/ebef427a893f6cfea0173ac3e1bf6f16.jpg') no-repeat center center/cover;
        }
        .frame {
            width: 100%;
            max-width: 900px;
            padding: 10px;
            border-radius: 18px;
            background: rgba(10, 14, 30, 0.72);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            background: #000;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="frame">
        <video id="promoVideo" controls playsinline preload="metadata">
            <source src="https://archive.org/download/without-bronze-unlock-your-earning-potential-with-digital-skills-leads-guru-2026-1080-p-hd_202609/Without%20Bronze%20__%20Unlock%20Your%20Earning%20Potential%20with%20Digital%20Skills%20__%20LeadsGuru%202026%281080P_HD%29.mp4" type="video/mp4">
            आपका ब्राउज़र वीडियो टैग का समर्थन नहीं करता है।
        </video>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDQ5_Dm4QL5l1neubND79i71Mk6TOMFGxU",
            authDomain: "leadsguru-942de.firebaseapp.com",
            databaseURL: "https://leadsguru-942de-default-rtdb.firebaseio.com",
            projectId: "leadsguru-942de",
            storageBucket: "leadsguru-942de.appspot.com",
            messagingSenderId: "712411117397",
            appId: "1:712411117397:web:000ae6fd55e77d4d7e1dc",
            measurementId: "G-V2442MV4G7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const videoId = "video1";

        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user') || 'Anonymous';

        const video = document.getElementById('promoVideo');
        let maxtime = 0; 
        let lastTime = 0; 

        video.addEventListener('timeupdate', () => {
            if (video.seeking) return;
            if (video.currentTime - lastTime < 2) {
                maxtime = Math.max(maxtime, video.currentTime);
                database.ref('users/' + userName + '/videos/' + videoId).update({
                    furthestWatched: maxtime
                });
            }
            lastTime = video.currentTime;
        });

        video.addEventListener('seeking', () => {
            if (video.currentTime > maxtime + 0.5) {
                video.currentTime = maxtime;
            }
        });

        video.addEventListener('seeked', () => {
            lastTime = video.currentTime;
        });

        video.addEventListener('ratechange', () => {
            if (video.playbackRate > 2) video.playbackRate = 1;
        });
    </script>
</body>
</html>
