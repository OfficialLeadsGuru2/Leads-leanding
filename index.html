<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspirational Video Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff007f, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
            background-size: 400% 400%;
            animation: rainbow 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            text-align: center;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 85%;
            max-width: 750px;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        video {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.4);
        }

        p {
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 20px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .quote {
            font-style: italic;
            color: #e0e0e0;
            font-size: 1.1rem;
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <video controls>
            <source src="https://archive.org/download/without-thinking-potential-with-digital-skills-leads-guru-2026_202026_281080P_HD.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <h1>Learn high paying skills</h1>
        <p>Let's start your work with us</p>

        <div class="quote">
            "Your limitation—it's only your imagination. Push harder than yesterday if you want a different tomorrow."
        </div>
    </div>

</body>
</html>
